// gcscore.proto — local IPC contract between a thin language client (Go,
// Python, Java, C++) and the Rust GCS core running as a gRPC server over a
// Unix Domain Socket (either out-of-process as a shared sidecar daemon or
// in-process on a background runtime thread).
syntax = "proto3";

package gcscore.v1;

option go_package = "cloud.google.com/go/storage/internal/gcscorepb;gcscorepb";

service GcsCore {
  // Round-trip health check and latency/throughput microbenchmark; echoes `payload`.
  rpc Ping(PingRequest) returns (PingResponse);

  // One-shot or range read (ReadObject over JSON HTTP or gRPC CloudPath).
  // The first streamed ReadChunk carries ObjectMeta.
  rpc ReadObject(ReadObjectRequest) returns (stream ReadChunk);

  // Persistent gRPC BidiReadObject session: open once to obtain a descriptor
  // handle, issue concurrent ReadRange calls, and release via CloseObject.
  rpc OpenObject(OpenObjectRequest) returns (OpenObjectResponse);
  rpc ReadRange(ReadRangeRequest) returns (stream ReadChunk);
  rpc CloseObject(CloseObjectRequest) returns (Empty);

  // Client-streaming upload (WriteObject over JSON HTTP or BidiWriteObject over gRPC).
  // The first message on the stream must carry `header`.
  rpc WriteObject(stream WriteRequest) returns (WriteObjectResponse);

  // Single-page control-plane listing (mirrors language SDK iterators / PageInfo).
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse);

  // Linux shared-memory zero-copy read data plane: the client obtains a sealed
  // memfd over the companion `<socket>.shm` SCM_RIGHTS channel and mmaps it;
  // the server writes object bytes directly into the shared mapping and streams
  // only (offset, len) descriptors over gRPC.
  rpc ReadObjectShm(ReadObjectShmRequest) returns (stream ShmChunk);

  // Per-caller credential sessions. The host application obtains short-lived
  // OAuth2 bearer tokens from its own TokenSource and lends them to the server;
  // data RPCs pass the session id in `x-session` metadata. Every session is
  // cryptographically bound to the caller's kernel-verified (UID, PID) via SO_PEERCRED.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc UpdateToken(UpdateTokenRequest) returns (Empty);
  rpc CloseSession(SessionRef) returns (Empty);

  // Process-level CPU and memory telemetry for benchmark accounting.
  rpc Stats(StatsRequest) returns (StatsResponse);

  // Initiates a graceful server shutdown.
  rpc Shutdown(Empty) returns (Empty);
}

message Empty {}

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  JSON = 1;  // storage.googleapis.com JSON API over HTTP (reqwest)
  GRPC = 2;  // storage.googleapis.com gRPC v2 over CloudPath (tonic)
}

message PingRequest { bytes payload = 1; }
message PingResponse { bytes payload = 1; }

message ObjectMeta {
  int64 size = 1;
  int64 generation = 2;
  int64 metageneration = 3;
  string content_type = 4;
  string content_encoding = 5;
  uint32 crc32c = 6;
}

message ReadObjectRequest {
  string bucket = 1;
  string object = 2;
  int64 offset = 3;                        // Range start offset (< 0 for suffix range)
  int64 length = 4;                        // -1 reads to end of object
  int64 generation = 5;                    // 0 = latest generation
  optional int64 if_generation_match = 6;  // Unset or < 0 = no precondition; 0 = DoesNotExist
  Transport transport = 7;
  uint32 chunk_size = 8;                   // Target bytes per ReadChunk; 0 = server default
}

message ReadChunk {
  // Vector of slices so the server forwards underlying network buffers without
  // an intermediate concatenation copy; clients consume slices in order.
  repeated bytes data = 1;
  ObjectMeta meta = 2;  // Populated on the first chunk only
}

message ReadObjectShmRequest {
  ReadObjectRequest read = 1;
  uint64 region = 2;       // Region ID received from the `.shm` side channel
  uint64 base_offset = 3;  // Offset within the region to begin writing
  uint64 capacity = 4;     // Available bytes starting at base_offset
}

message ShmChunk {
  uint64 offset = 1;    // Absolute byte offset in the shared region
  uint64 len = 2;       // Byte length written
  ObjectMeta meta = 3;  // Populated on the first chunk only
}

message OpenObjectRequest {
  string bucket = 1;
  string object = 2;
  int64 generation = 3;
}

message OpenObjectResponse {
  uint64 handle = 1;
  ObjectMeta meta = 2;
}

message ReadRangeRequest {
  uint64 handle = 1;
  int64 offset = 2;
  int64 length = 3;
  uint32 chunk_size = 4;
}

message CloseObjectRequest { uint64 handle = 1; }

message WriteHeader {
  string bucket = 1;
  string object = 2;
  string content_type = 3;
  optional int64 if_generation_match = 4;  // Unset or < 0 = no precondition; 0 = DoesNotExist
  optional int64 known_size = 5;           // >= 0 enables single-shot upload on JSON path
  uint32 chunk_size = 6;                   // Resumable upload flush size; 0 = default
  Transport transport = 7;
}

message WriteRequest {
  oneof msg {
    WriteHeader header = 1;
    bytes data = 2;
  }
}

message WriteObjectResponse {
  int64 size = 1;
  int64 generation = 2;
  uint32 crc32c = 3;
  Transport transport_used = 4;
}

message ListObjectsRequest {
  string bucket = 1;
  string prefix = 2;
  string delimiter = 3;
  string start_offset = 4;
  string end_offset = 5;
  string page_token = 6;
  int32 page_size = 7;
  bool versions = 8;
}

message ListedObject {
  string name = 1;
  int64 size = 2;
  int64 generation = 3;
  int64 metageneration = 4;
  string content_type = 5;
  string storage_class = 6;
  int64 updated_unix_secs = 7;
  uint32 crc32c = 8;
}

message ListObjectsResponse {
  repeated ListedObject items = 1;
  repeated string prefixes = 2;
  string next_page_token = 3;
}

message ListBucketsRequest {
  string project = 1;
  string prefix = 2;
  string page_token = 3;
  int32 page_size = 4;
}

message ListedBucket {
  string name = 1;
  string location = 2;
  string storage_class = 3;
  int64 metageneration = 4;
  int64 created_unix_secs = 5;
}

message ListBucketsResponse {
  repeated ListedBucket items = 1;
  string next_page_token = 2;
}

message CreateSessionRequest {
  string access_token = 1;      // Short-lived OAuth2 bearer token (never a key file)
  int64 expiry_unix_secs = 2;
  string quota_project = 3;
}

message CreateSessionResponse { string session_id = 1; }

message UpdateTokenRequest {
  string session_id = 1;
  string access_token = 2;
  int64 expiry_unix_secs = 3;
}

message SessionRef { string session_id = 1; }

message StatsRequest { bool reset_peak_rss = 1; }

message StatsResponse {
  int32 pid = 1;
  double cpu_user_secs = 2;
  double cpu_sys_secs = 3;
  int64 rss_bytes = 4;       // Current VmRSS
  int64 peak_rss_bytes = 5;  // VmHWM (since last reset)
  int32 threads = 6;
  int64 uptime_ms = 7;
  int64 rpcs_served = 8;
}
